<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TodoList</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="background">
        <div class="orb orb-1"></div>
        <div class="orb orb-2"></div>
        <div class="orb orb-3"></div>
    </div>

    <!-- Theme Switcher -->
    <div class="theme-switcher" id="themeSwitcher">
        <button class="theme-toggle" id="themeToggle" title="切换主题">
            <svg viewBox="0 0 24 24" width="20" height="20"><path d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round"/></svg>
        </button>
        <div class="theme-dropdown" id="themeDropdown">
            <div class="theme-option" data-theme="default">
                <span class="theme-color" style="background: linear-gradient(135deg, #667eea, #764ba2)"></span>
                <span>梦幻紫</span>
            </div>
            <div class="theme-option" data-theme="cyberpunk">
                <span class="theme-color" style="background: linear-gradient(135deg, #f72585, #4cc9f0)"></span>
                <span>赛博朋克</span>
            </div>
            <div class="theme-option" data-theme="nature">
                <span class="theme-color" style="background: linear-gradient(135deg, #56ab2f, #a8e6cf)"></span>
                <span>自然绿</span>
            </div>
            <div class="theme-option" data-theme="sunset">
                <span class="theme-color" style="background: linear-gradient(135deg, #fa709a, #fee140)"></span>
                <span>日落橙</span>
            </div>
            <div class="theme-option" data-theme="ocean">
                <span class="theme-color" style="background: linear-gradient(135deg, #2193b0, #6dd5ed)"></span>
                <span>海洋蓝</span>
            </div>
            <div class="theme-option" data-theme="light">
                <span class="theme-color" style="background: linear-gradient(135deg, #f5f7fa, #c3cfe2)"></span>
                <span>简约白</span>
            </div>
        </div>
    </div>

    <div class="container">
        <header>
            <h1>
                <span class="icon">
                    <svg class="star" viewBox="0 0 24 24" width="36" height="36">
                        <polygon points="12,2 15,9 22,9 16,14 18,21 12,17 6,21 8,14 2,9 9,9" />
                    </svg>
                    <span class="sparkles">
                        <span class="sparkle"></span>
                        <span class="sparkle"></span>
                        <span class="sparkle"></span>
                    </span>
                </span>
                Todo List
            </h1>
            <p class="subtitle">让每一天都井井有条</p>
        </header>

        <!-- Calendar Section -->
        <div class="calendar-section">
            <div class="calendar-header">
                <button class="calendar-nav" id="prevMonth">
                    <svg viewBox="0 0 24 24" width="20" height="20"><path d="M15 18l-6-6 6-6" stroke="currentColor" stroke-width="2" fill="none"/></svg>
                </button>
                <h2 class="calendar-title" id="calendarTitle">2024年1月</h2>
                <button class="calendar-nav" id="nextMonth">
                    <svg viewBox="0 0 24 24" width="20" height="20"><path d="M9 18l6-6-6-6" stroke="currentColor" stroke-width="2" fill="none"/></svg>
                </button>
            </div>
            <div class="calendar-weekdays">
                <span>日</span>
                <span>一</span>
                <span>二</span>
                <span>三</span>
                <span>四</span>
                <span>五</span>
                <span>六</span>
            </div>
            <div class="calendar-days" id="calendarDays">
                <!-- Days will be generated by JavaScript -->
            </div>
            <div class="selected-date" id="selectedDate">
                <span class="date-label">当前日期</span>
                <span class="date-value" id="currentDateDisplay">2024年1月1日</span>
            </div>
        </div>

        <div class="input-section">
            <div class="input-wrapper">
                <input type="text" id="todoInput" placeholder="添加新任务..." autocomplete="off">
                <button id="voiceBtn" class="voice-btn" title="语音输入">
                    <svg viewBox="0 0 24 24" width="20" height="20"><path d="M12 14c1.66 0 3-1.34 3-3V5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3z"/><path d="M17 11c0 2.76-2.24 5-5 5s-5-2.24-5-5H5c0 3.53 2.61 6.43 6 6.92V21h2v-3.08c3.39-.49 6-3.39 6-6.92h-2z"/></svg>
                </button>
                <button id="addBtn" class="add-btn">
                    <span class="btn-icon">+</span>
                </button>
            </div>
        </div>

        <div class="filter-section">
            <button class="filter-btn active" data-filter="all">全部</button>
            <button class="filter-btn" data-filter="pending">待办</button>
            <button class="filter-btn" data-filter="completed">已完成</button>
        </div>

        <div class="stats">
            <div class="stat-item">
                <span class="stat-number" id="totalCount">0</span>
                <span class="stat-label">总计</span>
            </div>
            <div class="stat-item">
                <span class="stat-number" id="pendingCount">0</span>
                <span class="stat-label">待办</span>
            </div>
            <div class="stat-item">
                <span class="stat-number" id="completedCount">0</span>
                <span class="stat-label">完成</span>
            </div>
        </div>

        <ul class="todo-list" id="todoList">
            <!-- Todo items will be added here -->
        </ul>

        <div class="empty-state" id="emptyState">
            <div class="empty-icon">📝</div>
            <p>暂无任务，添加一个吧！</p>
        </div>

        <footer>
            <button id="clearCompleted" class="clear-btn">清除已完成</button>
            <div class="data-actions">
                <button id="exportBtn" class="action-btn export-btn">
                    <svg viewBox="0 0 24 24" width="16" height="16"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M7 10l5 5 5-5M12 15V3" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>
                    导出数据
                </button>
                <button id="importBtn" class="action-btn import-btn">
                    <svg viewBox="0 0 24 24" width="16" height="16"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M17 8l-5-5-5 5M12 3v12" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>
                    导入数据
                </button>
                <input type="file" id="importFile" accept=".json" hidden>
            </div>
        </footer>
    </div>

    <script src="app.js"></script>
</body>
</html>
