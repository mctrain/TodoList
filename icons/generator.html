<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>图标生成器</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 800px;
            margin: 50px auto;
            padding: 20px;
            background: #f5f5f5;
        }
        h1 {
            text-align: center;
            color: #333;
        }
        .icon-container {
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
            margin-top: 30px;
            justify-content: center;
        }
        .icon-item {
            text-align: center;
            background: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }
        canvas {
            display: block;
            margin: 0 auto 10px;
        }
        button {
            background: #667eea;
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 14px;
        }
        button:hover {
            background: #5a67d8;
        }
        .instructions {
            background: white;
            padding: 20px;
            border-radius: 10px;
            margin-bottom: 20px;
            line-height: 1.6;
        }
    </style>
</head>
<body>
    <h1>📱 TodoList PWA 图标生成器</h1>
    
    <div class="instructions">
        <h3>使用说明：</h3>
        <ol>
            <li>点击每个"下载"按钮，保存对应的图标文件</li>
            <li>将下载的 PNG 文件放入 <code>TodoList/icons/</code> 目录</li>
            <li>确保文件名与显示的一致</li>
            <li>刷新 TodoList 应用即可看到新图标</li>
        </ol>
        <p><strong>注意：</strong>如果下载失败，请截图手动保存为对应尺寸的 PNG 文件。</p>
    </div>
    
    <div class="icon-container" id="iconContainer"></div>
    
    <script>
        const sizes = [
            72, 96, 128, 144, 152, 192, 384, 512
        ];

        function createIcon(size, isMaskable = false) {
            const canvas = document.createElement('canvas');
            canvas.width = size;
            canvas.height = size;
            const ctx = canvas.getContext('2d');
            
            const padding = isMaskable ? size * 0.4 : 0;
            const iconSize = size - (padding * 2);
            const iconRadius = isMaskable ? iconSize / 2 : size * 0.15;
            
            // 绘制圆角矩形或圆形背景
            if (isMaskable) {
                ctx.fillStyle = 'transparent';
            } else {
                const gradient = ctx.createLinearGradient(0, 0, size, size);
                gradient.addColorStop(0, '#667eea');
                gradient.addColorStop(1, '#764ba2');
                ctx.fillStyle = gradient;
                ctx.beginPath();
                ctx.roundRect(0, 0, size, size, iconRadius);
                ctx.fill();
            }
            
            // 绘制星星
            const centerX = size / 2;
            const centerY = size / 2;
            const starOuterRadius = iconSize * 0.35;
            const starInnerRadius = starOuterRadius * 0.4;
            
            ctx.fillStyle = '#ffd700';
            ctx.beginPath();
            
            for (let i = 0; i < 5; i++) {
                const angle = (i * 4 * Math.PI) / 5 - Math.PI / 2;
                const x = centerX + Math.cos(angle) * starOuterRadius;
                const y = centerY + Math.sin(angle) * starOuterRadius;
                
                if (i === 0) {
                    ctx.moveTo(x, y);
                } else {
                    ctx.lineTo(x, y);
                }
                
                const innerAngle = angle + Math.PI / 5;
                const innerX = centerX + Math.cos(innerAngle) * starInnerRadius;
                const innerY = centerY + Math.sin(innerAngle) * starInnerRadius;
                ctx.lineTo(innerX, innerY);
            }
            
            ctx.closePath();
            ctx.fill();
            
            // 添加阴影
            ctx.shadowColor = 'rgba(0, 0, 0, 0.3)';
            ctx.shadowBlur = 10;
            ctx.shadowOffsetX = 0;
            ctx.shadowOffsetY = 5;
            
            return canvas;
        }

        function downloadIcon(canvas, filename) {
            const link = document.createElement('a');
            link.download = filename;
            link.href = canvas.toDataURL('image/png');
            link.click();
        }

        const container = document.getElementById('iconContainer');
        
        // 生成标准图标
        sizes.forEach(size => {
            const item = document.createElement('div');
            item.className = 'icon-item';
            
            const canvas = createIcon(size);
            
            const button = document.createElement('button');
            button.textContent = '下载';
            button.onclick = () => downloadIcon(canvas, `icon-${size}.png`);
            
            const label = document.createElement('div');
            label.textContent = `${size}x${size}`;
            
            item.appendChild(canvas);
            item.appendChild(label);
            item.appendChild(button);
            container.appendChild(item);
        });
        
        // 生成 maskable 图标
        const maskableItem = document.createElement('div');
        maskableItem.className = 'icon-item';
        
        const maskableCanvas = createIcon(512, true);
        
        const maskableButton = document.createElement('button');
        maskableButton.textContent = '下载';
        maskableButton.onclick = () => downloadIcon(maskableCanvas, 'maskable-icon-512.png');
        
        const maskableLabel = document.createElement('div');
        maskableLabel.textContent = '512x512 (Maskable)';
        
        maskableItem.appendChild(maskableCanvas);
        maskableItem.appendChild(maskableLabel);
        maskableItem.appendChild(maskableButton);
        container.appendChild(maskableItem);
    </script>
</body>
</html>
